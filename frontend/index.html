<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Card — Ultimate Team Style</title>
  <meta name="description" content="Generate a FIFA Ultimate Team style player card from any GitHub or Chess.com profile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ============ RESET & BASE ============ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: #06080f;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* ============ STARFIELD CANVAS ============ */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Gradient overlay on top of starfield */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(99, 60, 200, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 85%, rgba(30, 58, 138, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 15% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 45%);
    }

    /* ============ NAVBAR ============ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      height: 64px;
      background: rgba(6, 8, 15, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 800px;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .nav-link:hover {
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.05);
    }
    .nav-link:hover svg { opacity: 1; }

    .nav-link.active {
      color: #ffffff;
      background: rgba(201, 162, 39, 0.12);
      box-shadow: 0 0 20px rgba(201, 162, 39, 0.08);
    }
    .nav-link.active svg { opacity: 1; }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      border-radius: 2px;
    }

    .nav-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 4px;
    }

    /* Coming soon badge */
    .nav-link .coming-soon {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #c9a227;
      background: rgba(201, 162, 39, 0.15);
      border: 1px solid rgba(201, 162, 39, 0.2);
      border-radius: 4px;
      padding: 2px 5px;
      line-height: 1;
    }

    /* ============ MAIN CONTENT ============ */
    .main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 60px;
    }

    /* ============ HERO SECTION ============ */
    .hero {
      text-align: center;
      margin-bottom: 48px;
      animation: heroFadeIn 1s ease-out forwards;
    }
    @keyframes heroFadeIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(201, 162, 39, 0.08);
      border: 1px solid rgba(201, 162, 39, 0.15);
      font-size: 12px;
      font-weight: 600;
      color: #c9a227;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .hero-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9a227;
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .hero-title {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.05;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.7) 50%, #c9a227 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 16px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    /* ============ SEARCH BAR ============ */
    .search-container {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      animation: heroFadeIn 1s ease-out 0.2s both;
    }
    .search-container input {
      width: 320px;
      padding: 16px 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-right: none;
      border-radius: 14px 0 0 14px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      color: #e2e8f0;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 400;
      outline: none;
      transition: all 0.3s;
    }
    .search-container input::placeholder { color: rgba(255, 255, 255, 0.2); }
    .search-container input:focus {
      border-color: rgba(201, 162, 39, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }
    .search-container button {
      padding: 16px 32px;
      border: 1px solid rgba(201, 162, 39, 0.5);
      border-radius: 0 14px 14px 0;
      background: linear-gradient(135deg, rgba(201, 162, 39, 0.2), rgba(201, 162, 39, 0.1));
      backdrop-filter: blur(10px);
      color: #c9a227;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .search-container button:hover {
      background: linear-gradient(135deg, rgba(201, 162, 39, 0.35), rgba(201, 162, 39, 0.2));
      box-shadow: 0 4px 30px rgba(201, 162, 39, 0.15);
      transform: translateY(-1px);
    }
    .search-container button:active { transform: translateY(0); }

    /* ============ STATUS ============ */
    #status-msg {
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      min-height: 22px;
      margin-bottom: 12px;
      transition: opacity 0.3s;
    }
    #status-msg.error { color: #ef4444; }

    /* ============ CARD WRAPPER ============ */
    .card-area {
      perspective: 800px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============ THE CARD ============ */
    .fut-card {
      --primary: #1a3a7a;
      --primary-dark: #0d1f4a;
      --accent: #c9a227;
      --accent-light: #f5d75e;
      --text: #ffffff;
      --stat-text: #ffffff;

      width: 340px;
      height: 500px;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.3s;
      cursor: default;
      will-change: transform;

      animation: cardEntrance 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      opacity: 0;
    }
    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.8) rotateY(-10deg) translateY(40px); }
      100% { opacity: 1; transform: scale(1) rotateY(0deg) translateY(0); }
    }

    .fut-card::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light), var(--accent));
      z-index: -1;
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; filter: blur(0px); }
      50% { opacity: 1; filter: blur(2px); }
    }

    .card-bg {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: linear-gradient(160deg, var(--primary), var(--primary-dark));
      z-index: 0;
    }

    .card-inner-border {
      position: absolute;
      inset: 6px;
      border-radius: 13px;
      border: 1.5px solid var(--accent);
      opacity: 0.5;
      z-index: 1;
      pointer-events: none;
    }

    .card-arch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 140px;
      border-radius: 0 0 50% 50%;
      background: radial-gradient(ellipse at center top, rgba(201, 162, 39, 0.12) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
    }

    .card-shimmer {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }
    .card-shimmer::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255, 255, 255, 0.05) 40%,
        rgba(255, 255, 255, 0.12) 50%,
        rgba(255, 255, 255, 0.05) 60%,
        transparent 70%
      );
      animation: shimmerSweep 4s ease-in-out infinite;
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-80%) translateY(-20%) rotate(25deg); }
      100% { transform: translateX(80%) translateY(20%) rotate(25deg); }
    }

    /* ============ CARD CONTENT ============ */
    .card-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 22px 18px;
    }

    .card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .rating-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }
    .rating-number {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
      color: var(--accent-light);
      text-shadow: 0 2px 12px rgba(201, 162, 39, 0.5);
    }
    .rating-tier {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .card-top-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-top: 4px;
    }
    .top-lang-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(201, 162, 39, 0.12);
      border: 1px solid rgba(201, 162, 39, 0.25);
      border-radius: 6px;
      padding: 3px 10px;
      letter-spacing: 0.5px;
    }
    .card-logo {
      width: 28px;
      height: 28px;
      opacity: 0.35;
    }
    .chess-title-badge {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent-light);
      text-shadow: 0 1px 6px rgba(201, 162, 39, 0.4);
      letter-spacing: 2px;
    }

    /* ============ PHOTO AREA ============ */
    .photo-wrapper {
      width: 160px;
      height: 160px;
      position: relative;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .photo-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0.25;
      animation: ringPulse 3s ease-in-out infinite alternate;
    }
    .photo-ring:nth-child(2) {
      inset: -20px;
      opacity: 0.12;
      animation-delay: 0.5s;
    }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.15; }
      100% { transform: scale(1.04); opacity: 0.35; }
    }

    .photo-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent);
      position: relative;
      background: rgba(0,0,0,0.3);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(201, 162, 39, 0.08);
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-upload-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
      cursor: pointer;
      z-index: 3;
    }
    .photo-container:hover .photo-upload-overlay { opacity: 1; }
    .photo-upload-overlay svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
      margin-bottom: 4px;
    }
    .photo-upload-overlay span {
      font-size: 10px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .photo-upload-overlay input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      border-radius: 50%;
    }

    /* ============ NAME ============ */
    .player-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
      margin-bottom: 2px;
      text-align: center;
      max-width: 290px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-username {
      font-size: 12px;
      font-weight: 400;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .player-info-line {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .card-divider {
      width: 85%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
      margin-bottom: 16px;
    }

    /* ============ STATS GRID ============ */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 40px;
      width: 100%;
      max-width: 260px;
    }
    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--stat-text);
      min-width: 38px;
      text-align: right;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .card-footer {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
    }
    .card-footer-text {
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      font-weight: 600;
    }

    /* ============ TIER COLOR SCHEMES ============ */
    .fut-card.tier-legendary {
      --primary: #4a3000;
      --primary-dark: #2a1a00;
      --accent: #ffd700;
      --accent-light: #ffe866;
    }
    .fut-card.tier-elite {
      --primary: #0d1f5c;
      --primary-dark: #070f30;
      --accent: #c9a227;
      --accent-light: #f5d75e;
    }
    .fut-card.tier-skilled {
      --primary: #3b1055;
      --primary-dark: #1f0830;
      --accent: #d07be8;
      --accent-light: #e8a8f8;
    }
    .fut-card.tier-rising {
      --primary: #073a3a;
      --primary-dark: #021e1e;
      --accent: #2dd4bf;
      --accent-light: #5eead4;
    }
    .fut-card.tier-rookie {
      --primary: #1e293b;
      --primary-dark: #0f172a;
      --accent: #94a3b8;
      --accent-light: #cbd5e1;
    }

    /* ============ LOADING SPINNER ============ */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(201, 162, 39, 0.15);
      border-top-color: #c9a227;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ ACTIONS ============ */
    .actions-area {
      margin-top: 24px;
      display: none;
      animation: heroFadeIn 0.5s ease-out forwards;
    }
    .download-btn {
      padding: 12px 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }
    .download-btn:hover {
      border-color: rgba(201, 162, 39, 0.3);
      color: #c9a227;
      background: rgba(201, 162, 39, 0.06);
    }
    .download-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ============ FOOTER ============ */
    .site-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .site-footer p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 1px;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 640px) {
      .hero-title { font-size: 38px; }
      .hero-subtitle { font-size: 12px; letter-spacing: 2px; }
      .nav-inner { gap: 4px; }
      .nav-link { padding: 8px 14px; font-size: 11px; gap: 5px; }
      .nav-link svg { width: 15px; height: 15px; }
      .nav-divider { margin: 0 2px; }
      .coming-soon { display: none; }
    }
    @media (max-width: 420px) {
      .fut-card { width: 300px; height: 440px; }
      .rating-number { font-size: 46px; }
      .player-name { font-size: 18px; }
      .stat-value { font-size: 22px; }
      .photo-wrapper { width: 130px; height: 130px; }
      .search-container input { width: 200px; }
      .hero-title { font-size: 30px; }
    }
  </style>
</head>
<body>

  <!-- Starfield Canvas -->
  <canvas id="starfield"></canvas>
  <div class="bg-overlay"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <button class="nav-link active" id="nav-github" onclick="switchCardType('github')" data-type="github">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </button>

      <div class="nav-divider"></div>

      <button class="nav-link" id="nav-chess" onclick="switchCardType('chess')" data-type="chess">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 22H5v-2h14v2M17.16 8.26A4.96 4.96 0 0018 5.5C18 3.02 15.98 1 13.5 1S9 3.02 9 5.5c0 1.05.33 2.02.88 2.82L6 13h4v5h7v-5h4l-3.84-4.74zM13.5 3a2.5 2.5 0 010 5 2.5 2.5 0 010-5z"/></svg>
        Chess.com
      </button>

      <div class="nav-divider"></div>

      <button class="nav-link" id="nav-codeforces" onclick="switchCardType('codeforces')" data-type="codeforces" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 7.5A1.5 1.5 0 016 9v10.5a1.5 1.5 0 01-3 0V9a1.5 1.5 0 011.5-1.5zm7.5-3A1.5 1.5 0 0113.5 6v13.5a1.5 1.5 0 01-3 0V6A1.5 1.5 0 0112 4.5zm7.5 6a1.5 1.5 0 011.5 1.5v7.5a1.5 1.5 0 01-3 0V12a1.5 1.5 0 011.5-1.5z"/></svg>
        Codeforces
        <span class="coming-soon">SOON</span>
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <!-- Hero -->
    <div class="hero" id="hero-section">
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        FIFA Ultimate Team Style Cards
      </div>
      <h1 class="hero-title" id="page-title">PLAYER CARD</h1>
      <p class="hero-subtitle" id="page-sub">Generate your ultimate team card from any profile</p>
    </div>

    <!-- Search -->
    <div class="search-container">
      <input id="username-input" type="text" placeholder="e.g. torvalds" autocomplete="off" />
      <button id="generate-btn" onclick="generateCard()">Generate</button>
    </div>

    <div id="status-msg"></div>

    <div class="card-area" id="card-area">
      <!-- Card renders here -->
    </div>

    <div class="actions-area" id="actions-area">
      <button class="download-btn" id="download-btn" onclick="downloadPNG()">↓ Download PNG</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>PLAYER CARD · NOT AN OFFICIAL PRODUCT · OPEN SOURCE</p>
  </footer>

  <script>
    // ============ STARFIELD ============
    (function initStarfield() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const STAR_COUNT = 200;
      let w, h;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function createStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            radius: Math.random() * 1.5 + 0.3,
            alpha: Math.random() * 0.6 + 0.1,
            dx: (Math.random() - 0.5) * 0.15,
            dy: (Math.random() - 0.5) * 0.15,
            pulse: Math.random() * Math.PI * 2,
            pulseSpeed: Math.random() * 0.01 + 0.005,
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          s.x += s.dx;
          s.y += s.dy;
          s.pulse += s.pulseSpeed;

          // Wrap around
          if (s.x < 0) s.x = w;
          if (s.x > w) s.x = 0;
          if (s.y < 0) s.y = h;
          if (s.y > h) s.y = 0;

          const alpha = s.alpha * (0.6 + 0.4 * Math.sin(s.pulse));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
        }

        // Draw a few connecting lines between nearby stars
        for (let i = 0; i < stars.length; i++) {
          for (let j = i + 1; j < stars.length; j++) {
            const dx = stars[i].x - stars[j].x;
            const dy = stars[i].y - stars[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(stars[i].x, stars[i].y);
              ctx.lineTo(stars[j].x, stars[j].y);
              ctx.strokeStyle = `rgba(201, 162, 39, ${0.06 * (1 - dist / 100)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(draw);
      }

      resize();
      createStars();
      draw();
      window.addEventListener('resize', () => { resize(); createStars(); });
    })();

    // ============ APP STATE ============
    // Use relative paths — works both locally and when deployed since
    // FastAPI serves the frontend from the same origin as the API
    const API_BASE = "";
    let customPhotoDataUrl = null;
    let currentCardType = "github";

    // ============ CARD TYPE SWITCH ============
    function switchCardType(type) {
      if (type === 'codeforces') return; // not yet implemented
      currentCardType = type;
      const input = document.getElementById("username-input");

      document.querySelectorAll('.nav-link').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });

      if (type === "github") {
        input.placeholder = "e.g. torvalds";
      } else {
        input.placeholder = "e.g. hikaru";
      }
    }

    // ============ STAT CONFIG PER CARD TYPE ============
    const STAT_CONFIG = {
      github: [
        { key: "consistency", label: "CON" },
        { key: "depth",       label: "DEP" },
        { key: "range",       label: "RNG" },
        { key: "impact",      label: "IMP" },
        { key: "collaboration", label: "COL" },
      ],
      chess: [
        { key: "speed",       label: "SPD" },
        { key: "strategy",    label: "STR" },
        { key: "tactical",    label: "TAC" },
        { key: "consistency", label: "CON" },
        { key: "experience",  label: "EXP" },
      ],
    };

    const CARD_TYPE_FOOTER = {
      github: "GitHub Player Card",
      chess: "Chess.com Player Card",
    };

    // ============ GENERATE CARD ============
    async function generateCard() {
      const username = document.getElementById("username-input").value.trim();
      const statusEl = document.getElementById("status-msg");
      const cardArea = document.getElementById("card-area");

      if (!username) {
        statusEl.textContent = "Please enter a username";
        statusEl.className = "error";
        return;
      }

      statusEl.textContent = "";
      statusEl.className = "";
      cardArea.innerHTML = '<div class="spinner"></div>';
      document.getElementById("actions-area").style.display = "none";
      customPhotoDataUrl = null;

      // Collapse hero on generate
      document.getElementById("hero-section").style.marginBottom = "28px";

      const endpoint = currentCardType === "chess"
        ? `${API_BASE}/api/chess/${encodeURIComponent(username)}`
        : `${API_BASE}/api/card/${encodeURIComponent(username)}`;

      try {
        const resp = await fetch(endpoint);
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          statusEl.textContent = err.detail || `Error: ${resp.statusText}`;
          statusEl.className = "error";
          cardArea.innerHTML = "";
          return;
        }
        const data = await resp.json();
        renderCard(data);
      } catch (e) {
        statusEl.textContent = "Network error — is the backend running?";
        statusEl.className = "error";
        cardArea.innerHTML = "";
      }
    }

    // ============ RENDER CARD ============
    function renderCard(data) {
      const cardArea = document.getElementById("card-area");
      const cardType = data.card_type || currentCardType;
      const tierClass = `tier-${data.tier.toLowerCase()}`;

      const badgeText = data.badge_text
        || (data.top_languages && data.top_languages.length > 0 ? data.top_languages[0] : "Code");

      const avatarUrl = data.avatar_url || "";
      const displayName = (data.name || data.username).toUpperCase();
      const truncName = displayName.length > 16 ? displayName.slice(0, 16) : displayName;

      const statConfig = STAT_CONFIG[cardType] || STAT_CONFIG.github;
      const stats = statConfig.map(s => ({
        value: data.attributes[s.key] || 0,
        label: s.label,
      }));
      stats.push({ value: data.overall, label: "OVR" });

      const statsHtml = stats.map((s, i) => `
        <div class="stat-item">
          <span class="stat-value" data-target="${s.value}" data-index="${i}">0</span>
          <span class="stat-label">${s.label}</span>
        </div>
      `).join("");

      const infoLine = data.info_line
        || `${data.public_repos} repos · ${data.followers} followers · ${data.total_stars}★ · ${data.account_age_years} yrs`;

      const footerText = CARD_TYPE_FOOTER[cardType] || "Player Card";

      const logoSvg = cardType === "chess"
        ? `<svg class="card-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M19 22H5v-2h14v2M17.16 8.26A4.96 4.96 0 0018 5.5C18 3.02 15.98 1 13.5 1S9 3.02 9 5.5c0 1.05.33 2.02.88 2.82L6 13h4v5h7v-5h4l-3.84-4.74zM13.5 3a2.5 2.5 0 010 5 2.5 2.5 0 010-5z"/></svg>`
        : `<svg class="card-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`;

      const chessTitleHtml = cardType === "chess" && data.chess_title
        ? `<span class="chess-title-badge">${data.chess_title}</span>`
        : "";

      cardArea.innerHTML = `
        <div class="fut-card ${tierClass}" id="fut-card">
          <div class="card-bg"></div>
          <div class="card-inner-border"></div>
          <div class="card-arch"></div>
          <div class="card-shimmer"></div>

          <div class="card-content">
            <div class="card-top">
              <div class="rating-block">
                <span class="rating-number" id="rating-number" data-target="${data.overall}">0</span>
                <span class="rating-tier">${data.tier}</span>
              </div>
              <div class="card-top-right">
                ${chessTitleHtml}
                <span class="top-lang-badge">${badgeText}</span>
                ${logoSvg}
              </div>
            </div>

            <div class="photo-wrapper">
              <div class="photo-ring"></div>
              <div class="photo-ring"></div>
              <div class="photo-container" id="photo-container">
                <img id="player-photo" src="${avatarUrl}" alt="${data.name}" crossorigin="anonymous" />
                <div class="photo-upload-overlay">
                  <svg viewBox="0 0 24 24"><path d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/></svg>
                  <span>Add Photo</span>
                  <input type="file" accept="image/*" onchange="handlePhotoUpload(event)" title="Upload custom photo" />
                </div>
              </div>
            </div>

            <div class="player-name">${truncName}</div>
            <div class="player-username">@${data.username}</div>
            <div class="player-info-line">${infoLine}</div>

            <div class="card-divider"></div>

            <div class="stats-grid">
              ${statsHtml}
            </div>

            <div class="card-footer">
              <span class="card-footer-dot"></span>
              <span class="card-footer-text">${footerText}</span>
              <span class="card-footer-dot"></span>
            </div>
          </div>
        </div>
      `;

      animateStatCountUp();
      animateRatingCountUp();
      setupHoverTilt();

      document.getElementById("actions-area").style.display = "block";
      window.currentCardUsername = data.username;
      window.currentCardData = data;
    }

    // ============ STAT COUNT-UP ANIMATION ============
    function animateStatCountUp() {
      const statEls = document.querySelectorAll(".stat-value[data-target]");
      statEls.forEach((el) => {
        const target = parseInt(el.dataset.target, 10);
        const delay = parseInt(el.dataset.index || "0", 10) * 80;
        const duration = 800;

        setTimeout(() => {
          const start = performance.now();
          function tick(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.round(target * eased);
            if (progress < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }, 300 + delay);
      });
    }

    // ============ RATING COUNT-UP ============
    function animateRatingCountUp() {
      const el = document.getElementById("rating-number");
      if (!el) return;
      const target = parseInt(el.dataset.target, 10);
      const duration = 1000;
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(target * eased);
        if (progress < 1) requestAnimationFrame(tick);
      }
      setTimeout(() => requestAnimationFrame(tick), 200);
    }

    // ============ HOVER 3D TILT ============
    function setupHoverTilt() {
      const card = document.getElementById("fut-card");
      if (!card) return;

      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateY = ((x - centerX) / centerX) * 12;
        const rotateX = ((centerY - y) / centerY) * 12;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        card.style.boxShadow = `${-rotateY * 2}px ${rotateX * 2}px 40px rgba(0, 0, 0, 0.35)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0) rotateY(0)";
        card.style.boxShadow = "0 8px 32px rgba(0, 0, 0, 0.3)";
      });
    }

    // ============ PHOTO UPLOAD ============
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        customPhotoDataUrl = e.target.result;
        const img = document.getElementById("player-photo");
        if (img) img.src = customPhotoDataUrl;
      };
      reader.readAsDataURL(file);
    }

    // ============ DOWNLOAD PNG ============
    async function downloadPNG() {
      const username = window.currentCardUsername;
      const cardData = window.currentCardData;
      if (!username) return;
      const btn = document.getElementById("download-btn");
      const originalText = btn.textContent;
      btn.textContent = "Generating...";
      btn.disabled = true;

      try {
        const cardType = (cardData && cardData.card_type) || currentCardType;
        const svgEndpoint = cardType === "chess"
          ? `${API_BASE}/api/chess/${encodeURIComponent(username)}/svg`
          : `${API_BASE}/api/card/${encodeURIComponent(username)}/svg`;

        const resp = await fetch(svgEndpoint);
        if (!resp.ok) throw new Error("Failed to fetch SVG");
        let svgText = await resp.text();

        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 460;
        const ctx = canvas.getContext("2d");

        const img = new Image();
        const svgBlob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);

          const pngUrl = canvas.toDataURL("image/png");
          const a = document.createElement("a");
          a.download = `${username}-${cardType}-card.png`;
          a.href = pngUrl;
          a.click();

          btn.textContent = originalText;
          btn.disabled = false;
        };
        img.onerror = () => {
          console.error("Image load error");
          btn.textContent = "Error";
          btn.disabled = false;
        };
        img.src = url;
      } catch (e) {
        console.error(e);
        btn.textContent = "Error";
        btn.disabled = false;
      }
    }

    // ============ ENTER KEY ============
    document.getElementById("username-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") generateCard();
    });
  </script>
</body>
